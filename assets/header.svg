<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="45%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#484F58"/>
      <stop offset="100%" stop-color="#21262D"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#484F58" opacity="0.35"/>
    </pattern>

    <!-- Subtle Radial Accent -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#21262D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2.5px;
      fill: #8B949E;
    }
    .tag {
      font-family: "JetBrains Mono", monospace, -apple-system, BlinkMacSystemFont;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #C9D1D9;
    }
    .quote {
      font-family: "Georgia", serif, -apple-system;
      font-size: 13px;
      font-style: italic;
      letter-spacing: 1px;
      fill: #6E7681;
    }
    .subtag {
      font-family: "JetBrains Mono", monospace, -apple-system, BlinkMacSystemFont;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #8B949E;
    }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#dot-grid)"/>
  <circle cx="425" cy="110" r="160" fill="url(#center-glow)"/>
  <rect x="2" y="2" width="846" height="216" rx="14" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Accent Bar / Window Controls -->
  <circle cx="28" cy="24" r="4.5" fill="#30363D"/>
  <circle cx="44" cy="24" r="4.5" fill="#21262D"/>
  <circle cx="60" cy="24" r="4.5" fill="#161B22"/>
  <line x1="82" y1="24" x2="822" y2="24" stroke="#21262D" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Terminal prompt tag -->
  <rect x="340" y="42" width="170" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="425" y="57" text-anchor="middle" class="tag">&gt; HELLO_WORLD //&lt;</text>

  <!-- Main Name -->
  <text x="425" y="103" text-anchor="middle" class="title">ANUGRAH PAL</text>

  <!-- Subtitle -->
  <text x="425" y="132" text-anchor="middle" class="subtitle">FULL STACK DEVELOPER • JAVA &amp; SYSTEMS ENTHUSIAST</text>

  <!-- Quote -->
  <text x="425" y="161" text-anchor="middle" class="quote">"Flectere si nequeo superos, Acheronta movebo."</text>

  <!-- Bottom Pills -->
  <g transform="translate(425, 189)">
    <rect x="-195" y="-12" width="115" height="21" rx="5" fill="#161B22" stroke="#30363D" stroke-width="0.8"/>
    <text x="-137.5" y="2.5" text-anchor="middle" class="subtag">MERN STACK</text>

    <rect x="-70" y="-12" width="140" height="21" rx="5" fill="#161B22" stroke="#30363D" stroke-width="0.8"/>
    <text x="0" y="2.5" text-anchor="middle" class="subtag">JAVA &amp; LLD / DSA</text>

    <rect x="80" y="-12" width="115" height="21" rx="5" fill="#161B22" stroke="#30363D" stroke-width="0.8"/>
    <text x="137.5" y="2.5" text-anchor="middle" class="subtag">SYSTEM DESIGN</text>
  </g>
</svg>
